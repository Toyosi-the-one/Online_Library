<div class="collection-container">

  <h1>Book Collection</h1>

  <!-- Controls -->
  <div class="controls">
    <label>Total books fetched:</label>
    <select [(ngModel)]="totalFetched" (ngModelChange)="onTotalFetchedChange()">
      <option *ngFor="let option of [10, 20, 40, 50, 100, 200]" [ngValue]="option">
        {{ option }}
      </option>
    </select>

    <label>Books per page:</label>
    <select [(ngModel)]="bookLimit" (ngModelChange)="onBookLimitChange()">
      <option *ngFor="let option of [5, 10, 20, 25, 50, 100]" [ngValue]="option">
        {{ option }}
      </option>
    </select>

    <div class="action-buttons">
      <button routerLink="/addbook">Add Books</button>
      <button routerLink="/editbooks">Edit Books</button>
      <button routerLink="/deletebooks">Delete Books</button>
    </div>
  </div>

  <!-- Book cards -->
  <div class="collection">
    <app-bookcard *ngFor="let book of pagedBooks" [book]="book" (select)="goToDetails($event)">
    </app-bookcard>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button (click)="prevPage()" [disabled]="currentPage === 1">
        Previous
      </button>

      <span>Page {{ currentPage }} of {{ totalPages }}</span>

      <button (click)="nextPage()" [disabled]="currentPage === totalPages">
        Next
      </button>
    </div>
  </div>

</div>
