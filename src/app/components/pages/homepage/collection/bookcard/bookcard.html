<div class="book-card" (click)="onClick()" style="font-size: 10px; max-width: 150px !important;">
    <div class="infoWrapper" style="max-width: 150px;">
        <img [src]="book.coverImage" [alt]="book.title" style="height: 15em; width: 15em;" />
        <h3 style="text-align: center; line-height: 25px;">{{ book.title }}</h3>
    </div>
</div>
